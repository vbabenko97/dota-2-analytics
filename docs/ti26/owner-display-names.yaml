# The exact TI-facing names the owner submits, in submission order.
#
# A VERSIONED INPUT, not a measurement. Names are cosmetic to the model: every
# ordering decision in the pipeline is keyed on the configured team_id, and
# renaming a team cannot move a card slot (see tests/test_montecarlo.py and
# tests/test_optimize.py, which cover the exact-tie case that used to break
# that property). These are what goes on the compendium form.
#
# `model_name` is the display name in config/ti2026_teams.yaml. Where it differs
# from `submission_name` the difference is cosmetic only. `former_name` records
# the org's previous branding, for the human doing the pre-lock identity check.
#
# The pre-lock procedure that consumes this file is docs/ti26/near-lock-runbook.md.
# Confirm identity by ACCOUNT SET, never by name.

