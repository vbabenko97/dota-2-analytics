      update. Accompanied by an explicit tiering (S: Spirit; A: Liquid, Falcons,
      PVISION; B: BB, Tundra, Aurora, Tidebound, Xtreme, NaVi, Nigma; C: Heroic,
      Yakutao; D: Wildcard, BOOM, Nemesis) and the caveat "PROBABLY COMPLETELY
      WRONG".
    aliases:
