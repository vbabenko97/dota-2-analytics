# Compendium cards published by other people before TI 2025, for scoring against
# the frozen truth in `ti2025_backtest.yaml`.
#
# WHY THIS FILE EXISTS. Every internal benchmark this project has compares the
# pipeline against itself or against a random card. Neither says whether the
# TASK is doable. An expert card, published in advance by someone with a rating
# model and domain knowledge this project does not have, is the only external
# calibration available for that question.
#
# ADMISSION RULE, so this cannot become a curated list of cards that flatter us:
#   - The card must have been PUBLISHED BEFORE the event began, with a URL and a
#     date, by someone who was not asked to produce it for this comparison.
#   - It must be transcribed in full. A card cannot be entered partially, and a
#     card cannot be removed once entered.
#   - Its category counts must match the format's capacities exactly, which
#     `cli_external_cards` asserts rather than trusts.
#
# NAMES are as the source wrote them in September 2025. `aliases` maps them onto
# the CURRENT OpenDota labels the truth file uses (BoomBoys played as BetBoom
# Team, TEAM VISION as PARIVISION, Yakult Brothers as Yakutou Brothers). The
# mapping is cosmetic and is checked for completeness at load.
#
# TRANSCRIPTION SOURCE: the owner supplied screenshots of the compendium UI from
# each linked post. These are transcriptions of images, not fetched data; no
# snapshot binds them and no manifest hashes them. That is a weaker provenance
# than anything else this pipeline consumes, and it is why this file is an input
# to a DIAGNOSTIC and reaches no gate.

cards:
