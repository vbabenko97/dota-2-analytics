# The 16 teams in the TI 2026 Swiss stage, with their OpenDota team_ids.
#
# Populated 2026-08-02 after the real ingest (snapshot 20260802T165535Z,
# 41,140 maps). The 16-team field itself (7 direct invites + 9 regional
# qualifier winners) is corroborated across multiple independent outlets
# (dotesports, gosugamers, hotspawn — cross-checked 2026-08-02); team_ids
# were resolved against our own store by matching org name to the most
# active/most recent team_id fielding a 5-account roster, since several
# orgs are recorded under more than one OpenDota team_id (see notes below).
#
# Ambiguous resolutions, evidence recorded here rather than assumed:
# - Xtreme Gaming, HULIGANI, Team Resilience: each has 2-3 OpenDota
#   team_ids in our store with IDENTICAL 5-account rosters (a data
#   duplicate, not a roster change) -- confirmed by direct account
#   comparison. Any of the duplicate ids resolves to the same
#   roster_version_id, so the choice below (favoring the id whose own
#   `name` field matches, or the one with the longest history) is cosmetic.
# - HULIGANI: team_id 10149530 is OpenDota's own "HULIGANI"-named id
#   (active 2026-06-01 to 2026-06-28, the EU qualifier window); the
#   organization's much larger history (463 maps) sits under 9303383,
#   labeled "L1GA TEAM" (their pre-rebrand name, per public reporting) --
#   same 5 accounts throughout, confirmed by direct comparison.
# - Nigma Galaxy: team_id 7554697's last map (2026-05-08) and 10136357's
#   first map (2026-05-09) are the IDENTICAL 5-account roster
#   (3e38bebcf099aea5, continuity 1.0) -- a duplicate team_id, same
#   category as the three above, corrected 2026-08-02 after an earlier
#   version of this note wrongly attributed a 3/5-continuity figure to
#   this handoff. The GENUINE roster change happens later, entirely
#   WITHIN team_id 10136357: last map under 3e38bebcf099aea5 is
#   2026-06-03, first map under the new roster 3ea16a8a0fbc3023 is
#   2026-06-21 (continuity 0.6; 140297552 and 418942836 leave,
#   111620041 and 210053851 join), matching public reporting's ~06-08
#   date for the SumaiL/Lorenof change. No alias needed for either event:
#   the May handoff already shares one roster_version_id, and the June
#   change never crosses a team_id boundary, so `RosterIndex` resolves
#   its predecessor from 10136357's own history alone. Confirmed
#   empirically -- fitting GlickoModel over the full store with and
#   without a 7554697->10136357 alias produces the IDENTICAL strength for
#   3ea16a8a0fbc3023 (2.324358513350741 either way). See
#   config/team_aliases.yaml for the corrected ledger entry (alias removed).
# - HEROIC -> LGD Gaming (South America): full 5/5 roster continuity
#   (confirmed), sequential non-overlapping dates (2026-04-24 -> 05-26).
#   No alias needed: identical accounts already share one roster_version_id.
# - LGD Gaming (10150538) vs a fourth duplicate id, 10208068 "LGD.Pinghu"
#   (2026-07-31 -> 2026-08-01, 6 maps): found 2026-08-02 by
#   `check_roster_staleness` (teams.py), not by name search. IDENTICAL 5/5
#   roster (81306398, 105045291, 177203952, 292921272, 1026694469),
#   confirmed by direct comparison -- same category as Xtreme
#   Gaming/HULIGANI/Team Resilience above, not a migration. No alias
#   needed.
# - Tundra Esports -> 1win: corrected 2026-08-02, then RE-corrected same
#   day after a mixed-population error (below). Public reporting says
#   Tundra Esports exited competitive Dota 2 on 2026-06-01 and the roster
#   moved to sponsor "1win" (itself possibly renamed again for TI, the
#   same gambling-sponsorship restriction that forced BetBoom -> BoomBoys).
#   An org-NAME search for "1win"/"tundra" missed this, but querying by
#   ACCOUNTS instead of by name shows the identical 5-account roster
#   (86698277, 93618577, 136829091, 331855530, 346412363 -> rvid
#   e0492e01c08d07f5) recorded under three sequential, non-overlapping
#   team_ids. Figures below are THIS ROSTER's maps specifically (filtered
#   by rvid), verified directly against the store -- the first version of
#   this note quoted 8291895's ALL-ROSTERS total (447) as if it were this
#   roster's count, the same mixed-population mistake just caught and
#   fixed in the Nigma entry above:
#     - 8291895 "Tundra Esports": 189 maps of THIS roster (2025-10-14 ->
#       2026-05-18). This team_id's own total across every roster it has
#       ever fielded is 447 maps (2025-02-08 -> 2026-05-18) -- kept here
#       only to label it explicitly as a DIFFERENT, team_id-level count,
#       not to be added into the roster total below.
#     - 10150413 "Iron Wing": 24 maps (2026-05-19 -> 2026-05-30) -- this
#       id's entire history is this roster, so no mixed-population risk
#       here. Note this is the SAME 10150413 Task 3's alias ledger already
#       investigated as a candidate HULIGANI predecessor and correctly
#       declined, since HULIGANI's roster shares nothing with it; this is
#       an unrelated, separate identity for the same team_id.
#     - 10182357 "1w": 21 maps (2026-07-07 -> 2026-08-02, running up to
#       the snapshot edge) -- also this id's entire history.
#   This roster's total: 189 + 24 + 21 = 234 maps across all three
#   team_ids, merged into one rating for e0492e01c08d07f5 regardless of
#   which id is configured below (ratings key off the roster hash, never
#   team_id) -- `reports/strengths.csv` already carries this rvid with
#   `prior_driven=False`. Only the DISPLAY NAME/team_id below were stale.
#   Using 10182357 (the current, most-recent id). LIMITATION: this
#   org-name-first resolution method (name -> team_id -> that id's latest
#   roster) only found the right roster here because it did not change
#   again after 2026-05-18; it does not follow a roster forward across a
#   LABEL change the way an account-keyed search does, so the TI-facing
#   name for this entry needed a human re-check before publication.
#   RESOLVED 2026-08-04, display name "1win" -> "Iron Wing", on the
#   project owner's own TI-field name list (Tundra -> 1win -> Iron Wing).
#   Note OpenDota's per-id labels do NOT agree with that chronology --
#   each id keeps whatever name it was registered under, so the store
#   shows 10150413 as "Iron Wing" (the MIDDLE id, 2026-05-19 -> 05-30)
#   and the latest id 10182357 as "1w". The id labels are therefore not
#   evidence about the current name and were not used as such. Rating
#   impact: NONE. Re-verified 2026-08-04 that all three ids carry the
#   identical roster e0492e01c08d07f5 (189 + 24 + 21 = 234 maps), and
#   ratings key off that hash, never off team_id or display name.
# 2026-08-04 identity re-verification, prompted by the project owner supplying
# the authoritative TI-facing name list (old org -> TI name). Every entry below
# was checked by ACCOUNT SET against the store, not by name. One display name
# was wrong (1win -> Iron Wing, above); no team_id was wrong; no rating was
# attached to the wrong entity. Specifically:
# - PARIVISION -> TEAM VISION (9572001): renamed IN PLACE. A remote `teams`
#   search for '%pari%' returns no PARIVISION id at all -- only unrelated
#   teams (Pariah Caste, Pariente Gaming, Paris Saint-Germain). 9572001's own
#   history is continuous and complete: 237 maps of one roster (2025-02-16 ->
#   2026-01-05), then 97, then the current 80, each successor sharing 4/5
#   accounts with its predecessor. This is the best-supported chain in the
#   field, which matters because this entry holds the card's 4-0 slot.
# - Apex Genesis -> GamerLegion (9964962): the 267-map Apex Genesis roster
#   77aa9436a6f28e94 was fielded by team_id 9964962 ITSELF for 86 of those
#   maps (2025-11-15 -> 2026-02-20) before two single-player swaps produced
#   567fc3ef3c882d03 then the current 8f07578dc483e1ae. So `RosterIndex`'s
#   predecessor chain -- which keys on the team's own roster SEQUENCE, not on
#   account overlap -- resolves back through the Apex Genesis roster without
#   an alias. Separate ids 9381678/9466753 named "Apex Genesis" hold the
#   earlier part of that same rvid; irrelevant, since ratings key on rvid.
# - OG (2586976) signed an entirely new SEA roster on 2025-11-08 (a 5/5
#   replacement of the EU roster, confirmed: b6807127ad482080 ends 2025-10-21,
#   cea28836f2f70903 begins 2025-11-15 sharing ZERO accounts). The current
#   roster d8b9dd1522124292 (27 maps, the THINNEST in the field) chains back
#   through ededc1aba09e25f0 to that SEA roster's 109 maps, sharing 4/5
#   accounts each step, so its prior comes through the SEA side and never
#   through the discarded EU roster.
# - Two further duplicate team_ids found 2026-08-04 that the 2026-08-02 pass
#   missed, both registered after it: 10208009 "L1GA TEAM" and 10207984
#   "Team resilience". Both are the same category as the duplicates above --
#   IDENTICAL 5/5 rosters to their configured counterparts, sharing rvid
#   dbc6910c22be2655 (HULIGANI) and eac6601adfecb821 (Team Resilience)
#   respectively -- so their maps ALREADY inform those ratings and the
#   configured ids still resolve to the right roster. No alias, no config
#   change. They do mean the roster totals are current through 2026-08-01/02
#   rather than through the configured ids' own last maps (2026-06-28 and
#   2026-06-18), so neither team is as idle as its configured id suggests.
