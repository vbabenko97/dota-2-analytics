#   2026-05-26 onward. This does not change the conclusion or require an
#   alias: `ti2026_teams.yaml` already configures Team Vision at 9572001,
#   whose own last map (2026-06-25) already resolves to this exact roster,
#   and ratings merge automatically by roster hash regardless of team_id --
#   the same reasoning as the duplicate-id cases above. Recorded because a
#   ledger entry should say what is true NOW, not just what was true when
#   it was written -- the same principle the Nigma correction above rests on.
#
