# Single source of truth for rules that could differ from our reading of
# Valve's published text. Anything logically forced by these parameters
# (record counts, category counts, the random baseline) is DERIVED in
# rules.py and deliberately absent here.

format:
  n_teams: 16
  total_rounds: 5
  advance_at_wins: 4
  eliminate_at_losses: 4

tiebreak_order:
  - series_wins
  - series_losses
  - opponent_series_wins
  - game_win_pct
  - opponent_game_win_pct
  - avg_duration
  - coin_toss

rounds:
  within_group: [2, 3]
  cross_group: [4]
  max_distance_when_loser_eliminated: [5]

duration_model:
  # Fitted in D2 from real map durations (reports/duration_fit.json).
  # log_sigma is the MARGINAL sd of log-duration -- what DurationResolver
  # actually samples from, since it draws with no gap term of its own. The
  # fit's rating-gap coefficient was not material (see the D2 gate report)
  # and is not applied here; see spec XII / task-8 known limitations.
  log_mean: 7.579288849767151      # exp(7.579...) ~ 1953s ~ 32.6 min
  log_sigma: 0.2805980274352356
  fitted_from_n_maps: 41082

# `reported_official` means: a secondhand report of Valve's published rules that
# nothing in this repository can check against the SOURCE. The design spec
# records that the rules page is JavaScript-rendered, that two fetch attempts
# returned no body, and that the values were relayed with citations the session
# could not open; the D1 pass that was to confirm them has since been withdrawn,
# and no archived copy of the page is committed. These were tagged `official`
# until 2026-08-06, which asserted a verification that has never existed.
#
# They are, however, CORROBORATED BY OBSERVATION. `ti26.cli_pairing_check`
# reconstructs TI 2025 -- the only event that has ever run this format -- from
# the committed store and reproduces this structure exactly: all 44 series pair
# equal records, two groups of 8, rounds 1-3 entirely within group, round 4
# entirely cross-group in all 8 series, five Swiss rounds then one elimination
# round of 5 series each pairing a 3-2 team against a 2-3 team. Teams played 4,
# 5 or 6 series, matching that shape. So the tag stays `reported_official`
# because the source is still unreadable, but the values are no longer merely
# asserted. Confirming that TI 2026 uses the same format remains an owner task:
# it needs sources outside `explorer_query`, this project's only network path.
provenance:
  n_teams: reported_official
  total_rounds: reported_official
  advance_at_wins: reported_official
  eliminate_at_losses: reported_official
  tiebreak_order: reported_official
  within_group_rounds: reported_official
  cross_group_rounds: reported_official
  max_distance_when_loser_eliminated: reported_official
  record_capacities: logically_forced
  category_capacities: logically_forced
  # The base pairing preference -- minimum ranking distance inside a record
  # bucket, uniform random among exact ties -- came from the consultation
  # document, not from any recorded official source. The spec's acceptance
  # criterion for it, reproducing TI 2025's pairings from actual results, has
  # now been discharged by `ti26.cli_pairing_check` and it FAILED: the real
  # pairing is among the engine's candidates in 4 of the 11 buckets where the
  # rule had a choice, which is about what indifference gives. The real bracket
  # sits at minimum distance in 5 buckets, maximum in 4 and between in 2, so it
  # follows neither this rule nor its opposite, and conventional Swiss folding
  # fits worse still at 2 of 11.
  #
  # `ti26.cli_schedule_sensitivity` then measured what that costs, and the
  # answer is nothing. Signal-to-noise 1.08: discarding the ranking-distance
  # criterion ENTIRELY moves category marginals less than re-running the same
  # rule under a different simulation seed does, and changes no assignment.
  # So the rule is wrong and immaterial, which is why it is still here.
  base_pairing_preference: refuted_immaterial
  # Same measurement, same conclusion: forcing minimisation everywhere moves
  # marginals by 0.00101 against a single-marginal standard error of 0.001.
  max_distance_when_loser_eliminated_preference: refuted_immaterial
  # Round 4's 0-3 group also eliminates its loser, but the published rule
  # names Round 5 only. Applying max-distance at R4 would be an inference
  # and is deliberately NOT enabled.
  max_distance_at_round_4: inferred
  # No published rule orders teams still exactly tied after duration.
  coin_toss_resolution: arbitrary
  # Repeat avoidance is "where possible" per the reported official text, which
  # reaches this repository through the same unopenable citations as the rest.
  repeat_avoidance_is_soft: reported_official
  duration_model: empirical   # fitted in D2; see reports/duration_fit.json
