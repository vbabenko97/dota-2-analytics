# Single source of truth for rules that could differ from our reading of
# Valve's published text. Anything logically forced by these parameters
# (record counts, category counts, the random baseline) is DERIVED in
# rules.py and deliberately absent here.

format:
  n_teams: 16
  total_rounds: 5
  advance_at_wins: 4
  eliminate_at_losses: 4

# TI 2026's own order, fetched 2026-08-08 from Valve's rules page and archived
# verbatim in docs/ti26/2026-08-08-ti2026-rules-fetched.md:
#
#     Number of Matches Won
#     Number of Matches Lost
#     Total Number of Matches Won by Opponents Played
#     Percentage of Games Won
#     Average Percentage of Games Won by Opponents Played
#     Average Game Duration (Shorter is Better)
#     Coin Toss
#
# Seven criteria, with duration sixth. TI 2025 ran SIX, with percentage of games
# won third and no duration. Earlier the same day, while the 2026 page still had
# no pairing section, commit 23beac3 rewrote this list to TI 2025's on the
# assumption the format carried over. Valve transposed criteria 3 and 4 and
# added duration, so it did not.
tiebreak_order:
  - series_wins
  - series_losses
  - opponent_series_wins
  - game_win_pct
  - opponent_game_win_pct
  - avg_duration
  - coin_toss

rounds:
  within_group: [2, 3]
  cross_group: [4]
  # TI 2026 Round 5: "For matches where the loser is eliminated, maximize the
  # distance in ranking between the teams." TI 2025 gave Round 5 no special
  # modifications, which is why this key was deleted earlier on 2026-08-08.
  max_distance_when_loser_eliminated: [5]

# TI 2026's elimination round is a SEQUENTIAL CHOICE, not a pairing rule:
#
#     Starting with the best 3-2 team, they will choose any of the five 2-3
#     teams as their opponent. The next best 3-2 team will then choose any of
#     the remaining 2-3 teams as their opponent. Repeat the above until all
#     teams have chosen an opponent.
#
# TI 2025 maximised ranking distance here instead, with no choice involved.
# `elimination.pair_elimination` still implements that and is used ONLY by
# `cli_pairing_check`, which validates the engine against TI 2025's real
# bracket and therefore needs TI 2025's rule.
#
# The rules fix the ORDER of choosing and say nothing about the BASIS, so
# `choice_policy` is an assumption about team behaviour rather than a reading of
# the rules -- tagged accordingly in `provenance` below.
elimination_round:
  choice_policy: rational

duration_model:
  # Fitted in D2 from real map durations (reports/duration_fit.json).
  # log_sigma is the MARGINAL sd of log-duration -- what DurationResolver
  # actually samples from, since it draws with no gap term of its own. The
  # fit's rating-gap coefficient was not material (see the D2 gate report)
  # and is not applied here; see spec XII / task-8 known limitations.
  log_mean: 7.579288849767151      # exp(7.579...) ~ 1953s ~ 32.6 min
  log_sigma: 0.2805980274352356
  fitted_from_n_maps: 41082

# `reported_official` means: a secondhand report of Valve's published rules that
# nothing in this repository can check against the SOURCE. The design spec
# records that the rules page is JavaScript-rendered, that two fetch attempts
# returned no body, and that the values were relayed with citations the session
# could not open; the D1 pass that was to confirm them has since been withdrawn,
# and no archived copy of the page is committed. These were tagged `official`
# until 2026-08-06, which asserted a verification that has never existed.
#
# They are, however, CORROBORATED BY OBSERVATION. `ti26.cli_pairing_check`
# reconstructs TI 2025 -- the only event that has ever run this format -- from
# the committed store and reproduces this structure exactly: all 44 series pair
# equal records, two groups of 8, rounds 1-3 entirely within group, round 4
# entirely cross-group in all 8 series, five Swiss rounds then one elimination
# round of 5 series each pairing a 3-2 team against a 2-3 team. Teams played 4,
# 5 or 6 series, matching that shape. So the tag stays `reported_official`
# because the source is still unreadable, but the values are no longer merely
# asserted. Confirming that TI 2026 uses the same format remains an owner task:
# it needs sources outside `explorer_query`, this project's only network path.
#
# 2026-08-07: that check was carried out, with the owner's permission, against
# public web sources rather than `explorer_query`. NO VALUE BELOW CHANGED and no
# tag was upgraded. What changed is the quality of the corroboration: it now
# comes from pages that were actually retrieved and can be re-retrieved, rather
# than from citations the originating session could not open.
#
#   CONFIRMED, from Liquipedia's api.php (the HTML page returns 403, the API
#   does not) and a GosuGamers report:
#     - n_teams 16
#     - total_rounds 5
#     - every group-stage series is Bo3, which matches `series.py`'s best_of=3
#       default. Nothing outside this repository had previously checked that.
#     - the advancement split: top 3 straight to playoffs, 4th-13th into an
#       elimination round where 5 of 10 advance, 14th-16th out. That is exactly
#       the record and category capacities rules.py derives.
#
#   NOT CONFIRMED, and deliberately still tagged as before:
#     - advance_at_wins and eliminate_at_losses are not stated by any source
#       retrieved. They are strongly implied -- the compendium's own prediction
#       categories are 4-0, 4-1, 1-4 and 0-4, and those records exist only under
#       this rule -- but implied is not stated.
#     - tiebreak_order: no source at all.
#     - within_group / cross_group rounds: no source at all. Two groups of eight
#       with rounds 1-3 inside them still rests solely on cli_pairing_check
#       reproducing TI 2025.
#
# Valve's own rules page was re-attempted the same day and again returned a
# heading with no body -- the identical JavaScript-rendering failure the design
# spec recorded. `official` therefore remains unavailable, and the test that
# forbids it stays.
#
# These are dated external observations, not inputs. No snapshot binds them and
# no manifest hashes them; they are reproducible only in the weak sense that the
# URLs can be fetched again and may have changed. Treat them accordingly.
# 2026-08-08, second update. The owner supplied a screenshot of the TI 2026
# compendium's own group-stage card. It labels the six categories in the
# product's own words:
#
#     4-0                       One undefeated team
#     4-1                       Two teams with 4 Wins and 1 loss
#     ELIMINATION ROUND WINNER  Five teams that win in the Elimination Round
#     ELIMINATION ROUND LOSER   Five teams that lose in the Elimination Round
#     1-4                       Two teams with 1 win and 4 losses
#     0-4                       One unvictorious team
#
# That is the format, stated by the thing being predicted, over sixteen named
# team slots. It fixes `n_teams`, `advance_at_wins` and `eliminate_at_losses`
# directly, and `total_rounds` follows: a team advances at 4 wins and is out at
# 4 losses, so the longest Swiss record possible is 4-1 or 1-4 and the stage is
# exactly five rounds. The capacities 1/2/5/5/2/1 are the counts it prints.
#
# These four therefore move OFF `reported_official`, which means "a secondhand
# report nothing here can check against the source". They are no longer
# secondhand. They are not `official` either -- this is a screenshot relayed by
# the owner, not a fetch this repository can repeat -- so the tag says exactly
# that and `tests/test_rules.py` still forbids `official`.
#
# Everything below them stays inherited from TI 2025's published rules text.
# The compendium card says nothing about pairing, ranking or tiebreaks, and
# TI 2026's own rules section still had none published as of 2026-08-08.
provenance:
  n_teams: compendium_ui_2026
  total_rounds: compendium_ui_2026
  advance_at_wins: compendium_ui_2026
  eliminate_at_losses: compendium_ui_2026
  # These four came off Valve's own TI 2026 rules page, fetched 2026-08-08 with
  # a headless browser and archived verbatim in
  # docs/ti26/2026-08-08-ti2026-rules-fetched.md. That page is JavaScript-
  # rendered, which is why every previous attempt in this project's history got
  # a heading with no body and why these values spent a week tagged as hearsay.
  #
  # The tag names the relay and the date, as the others do, and stops short of
  # `official`: no test here can re-read the page (tests never touch the
  # network), and Valve added this section to the page during the same day it
  # was first checked, so it is a dated observation rather than a fixed input.
  tiebreak_order: valve_rules_page_2026_08_08
  within_group_rounds: valve_rules_page_2026_08_08
  cross_group_rounds: valve_rules_page_2026_08_08
  max_distance_when_loser_eliminated: valve_rules_page_2026_08_08
  # NOT from the rules. The page fixes the ORDER in which 3-2 teams choose and
  # says nothing about how any of them decides, so this is a behavioural
  # assumption. `cli_schedule_sensitivity` prices all three policies.
  elimination_choice_policy: unspecified_by_published_rules
  record_capacities: logically_forced
  category_capacities: logically_forced
  # The base pairing preference -- minimum ranking distance inside a record
  # bucket, uniform random among exact ties -- came from the consultation
  # document, not from any recorded official source. The spec's acceptance
  # criterion for it, reproducing TI 2025's pairings from actual results, has
  # now been discharged by `ti26.cli_pairing_check` and it FAILED: the real
  # pairing is among the engine's candidates in 4 of the 11 buckets where the
  # rule had a choice, which is about what indifference gives. The real bracket
  # sits at minimum distance in 5 buckets, maximum in 4 and between in 2, so it
  # follows neither this rule nor its opposite, and conventional Swiss folding
  # fits worse still at 2 of 11.
  #
  # `ti26.cli_schedule_sensitivity` then measured what that costs, and the
  # answer is nothing. Signal-to-noise 1.08: discarding the ranking-distance
  # criterion ENTIRELY moves category marginals less than re-running the same
  # rule under a different simulation seed does, and changes no assignment.
  # So the rule is wrong and immaterial, which is why it is still here.
  base_pairing_preference: refuted_immaterial
  # Same measurement, same conclusion: forcing minimisation everywhere moves
  # marginals by 0.00101 against a single-marginal standard error of 0.001.
  max_distance_when_loser_eliminated_preference: refuted_immaterial
  # Round 4's 0-3 group also eliminates its loser, but the published rule
  # names Round 5 only. Applying max-distance at R4 would be an inference
  # and is deliberately NOT enabled.
  max_distance_at_round_4: inferred
  # No published rule orders teams still exactly tied after duration.
  coin_toss_resolution: arbitrary
  # "Avoid repeat pairings when possible" -- the fetched 2026 page, verbatim.
  repeat_avoidance_is_soft: valve_rules_page_2026_08_08
  duration_model: empirical   # fitted in D2; see reports/duration_fit.json
