# Seven playoff brackets, frozen before the first Main Event match.
#
# Registered in docs/superpowers/specs/2026-08-17-playoff-card-comparison.md.
# The headline comparison is designated there in advance as A vs E; B, C and D
# exist only to attribute the difference, and F and G are supplemental external
# entrants. None of them may be promoted to the headline after the outcomes are
# known, however well one happens to score.
#
# Every card is a coherent 14-slot bracket over the confirmed eight-team field
# under the CROSS-FEED topology, which is confirmed from the locked client
# (provenance: owner-supplied locked-client screenshot, not web or community
# evidence). The registered null for this topology is 3.75 / 14.
#
# `model_implied_expected` on each card is the sum of the model's own per-slot
# marginals under that card. It is descriptive only and never evidence of
# skill. It is recomputed from the store by `cli_playoff_cards`, which fails if
# these literals drift.

topology: cross-feed
topology_provenance: owner_supplied_locked_client_screenshot
null_expected_hits: 3.75

seeds:
  - Iron Wing
  - Team Spirit
  - Team Vision
  - BoomBoys
  - Team Liquid
  - Team Yandex
  - Nigma Galaxy
  - Team Falcons

cards:
  - id: A-model
    role: headline
    provenance: >-
      Model optimum by full enumeration of all 2^14 coherent brackets, on the
      post-group-stage store (protocol deviation recorded in the playoff spec).
      No human input.
    model_implied_expected: 4.3615
    picks:
      UB QF1: Team Spirit
      UB QF2: Team Vision
      UB QF3: Team Yandex
      UB QF4: Team Falcons
      UB SF1: Team Vision
      UB SF2: Team Yandex
      UB Final: Team Vision
      LB R1M1: BoomBoys
      LB R1M2: Team Liquid
      LB QF1: BoomBoys
      LB QF2: Team Spirit
      LB SF: Team Spirit
      LB Final: Team Yandex
      Grand Final: Team Vision

  - id: B-override-iron-wing
    role: attribution
    provenance: >-
      Model optimum subject to UB QF1 = Iron Wing. Constructed analytically to
      isolate one of the owner's two root decisions; never submitted anywhere.
    model_implied_expected: 4.2820
    picks:
      UB QF1: Iron Wing
      UB QF2: Team Vision
      UB QF3: Team Yandex
      UB QF4: Team Falcons
      UB SF1: Team Vision
      UB SF2: Team Yandex
      UB Final: Team Vision
      LB R1M1: BoomBoys
      LB R1M2: Team Liquid
      LB QF1: BoomBoys
      LB QF2: Team Liquid
      LB SF: Team Liquid
      LB Final: Team Yandex
      Grand Final: Team Vision

  - id: C-override-liquid
    role: attribution
    provenance: >-
      Model optimum subject to UB QF3 = Team Liquid. Constructed analytically to
      isolate the other root decision; never submitted anywhere.
    model_implied_expected: 4.2545
    picks:
      UB QF1: Team Spirit
      UB QF2: Team Vision
      UB QF3: Team Liquid
      UB QF4: Team Falcons
      UB SF1: Team Vision
      UB SF2: Team Falcons
      UB Final: Team Vision
      LB R1M1: BoomBoys
      LB R1M2: Nigma Galaxy
      LB QF1: BoomBoys
      LB QF2: Team Spirit
      LB SF: Team Spirit
      LB Final: Team Falcons
      Grand Final: Team Vision

  - id: D-override-both
    role: attribution
    provenance: >-
      Model optimum subject to BOTH root decisions. It is NOT the owner's card:
      the model still routes Team Yandex deep through the lower bracket, which
      the owner's card does not, so D and E differ at six further slots.
    model_implied_expected: 4.2002
    picks:
      UB QF1: Iron Wing
      UB QF2: Team Vision
      UB QF3: Team Liquid
      UB QF4: Team Falcons
      UB SF1: Team Vision
      UB SF2: Team Falcons
      UB Final: Team Vision
      LB R1M1: BoomBoys
      LB R1M2: Team Yandex
      LB QF1: BoomBoys
      LB QF2: Team Yandex
      LB SF: Team Yandex
      LB Final: Team Yandex
      Grand Final: Team Vision

  - id: E-owner
    role: attribution
    superseded_by: H-owner-final
    provenance: >-
      The owner's bracket as entered on 2026-08-17. SUPERSEDED: the owner
      revised six slots the following day, before any match, and H-owner-final
      is what was actually submitted. E is kept frozen and scored because it was
      a real position held at a real time, and deleting a superseded forecast
      because it was superseded is how a record becomes flattering. Formed AFTER
      seeing the model's per-slot probabilities and after watching the group
      stage, so it is out of sample with respect to the OUTCOMES but is not
      independent of the model.
    model_implied_expected: 4.1356
    picks:
      UB QF1: Iron Wing
      UB QF2: Team Vision
      UB QF3: Team Liquid
      UB QF4: Team Falcons
      UB SF1: Team Vision
      UB SF2: Team Liquid
      UB Final: Team Vision
      LB R1M1: BoomBoys
      LB R1M2: Nigma Galaxy
      LB QF1: Team Falcons
      LB QF2: Iron Wing
      LB SF: Team Falcons
      LB Final: Team Liquid
      Grand Final: Team Vision

  - id: F-gpt-5-6-xhigh
    role: external
    provenance: >-
      Bracket extracted from an LLM-authored analysis supplied by the owner,
      raw file frozen at predictions-from-llms/gpt-5-6-xhigh.md. Time of
      generation is NOT verifiable -- the file mtime is author-settable exactly
      as a git commit date is -- so the only defensible claim is that it was
      committed and pushed before the first Main Event match. The prompt,
      settings and tool access were not supplied, so no claim is made about the
      forecast's independence from any other entry here.
    source_sha256: 5e041d69f5c257b86553859587fa90bf6f4a59285ee10aebdae34e482adc50b1
    source_bytes: 45002
    stated_model_identity: owner_supplied_unverified
    # The author's own description of the method, not a claim by this project:
    # a recency-weighted, roster-aware Elo variant with an approximately 60-day
    # half-life, 300000 bracket simulations, explicitly "not presented as a
    # formally calibrated" model. That half-life is the same time-decay
    # hypothesis this project has DEFERRED to a future registration, so this
    # card is one unvalidated realisation of it rather than evidence for it.
    topology_used: cross-feed
    topology_evidence: none
    # It states it simulated "the standard eight-team double-elimination feed".
    # That is an ASSUMPTION of the standard topology, not an observation of the
    # locked client, and it may not be cited as corroboration of the topology.
    probability_semantics: >-
      The percentages in the source are CONDITIONAL series probabilities given
      that the projected matchup occurs, which the file itself calls conditional
      modal projections. They are NOT slot marginals and must never be placed
      beside this project's per-slot marginals as though they disagreed.
    model_implied_expected: 4.1886
    picks:
      UB QF1: Team Spirit
      UB QF2: Team Vision
      UB QF3: Team Liquid
      UB QF4: Team Falcons
      UB SF1: Team Vision
      UB SF2: Team Liquid
      UB Final: Team Vision
      LB R1M1: BoomBoys
      LB R1M2: Team Yandex
      LB QF1: Team Falcons
      LB QF2: Team Yandex
      LB SF: Team Yandex
      LB Final: Team Liquid
      Grand Final: Team Vision

  - id: G-gemini-3-1-pro
    role: external
    provenance: >-
      Bracket extracted from an LLM-authored analysis supplied by the owner,
      raw file frozen at predictions-from-llms/gemini-3-1-pro.md. Same limits as
      F: generation time unverifiable, prompt and settings not supplied, no
      independence claim.
    source_sha256: 018ce4da34d3f409746b53ab09096ebd6f138a5e38e523879a16b112df5f4364
    source_bytes: 38530
    stated_model_identity: owner_supplied_unverified
    topology_used: cross-feed
    topology_evidence: none
    # The source prose carries at least one internal contradiction: it states
    # the Main Event is an eight-team bracket and then places the LB Round 1
    # loser at "13th-16th place", which is impossible in a field of eight. The
    # 14 picks are unaffected, and that is exactly why the CARD is frozen here
    # and the explanatory text is not promoted to an evidence corpus.
    #
    # Checked and passing: its stated Swiss records for all eight playoff teams
    # match data/ti2026_outcome.yaml exactly.
    model_implied_expected: 4.0707
    picks:
      UB QF1: Iron Wing
      UB QF2: Team Vision
      UB QF3: Team Liquid
      UB QF4: Team Falcons
      UB SF1: Team Vision
      UB SF2: Team Falcons
      UB Final: Team Vision
      LB R1M1: Team Spirit
      LB R1M2: Nigma Galaxy
      LB QF1: Team Liquid
      LB QF2: Iron Wing
      LB SF: Team Liquid
      LB Final: Team Falcons
      Grand Final: Team Vision

  - id: H-owner-final
    role: headline
    supersedes: E-owner
    provenance: >-
      The owner's FINAL bracket, transcribed from the locked-client Predictions
      screen on 2026-08-18, before any Main Event match. This is the card
      actually submitted. It revises six slots of E-owner, including both root
      decisions: UB QF1 moved from Iron Wing to Team Spirit (joining the model)
      and UB QF4 from Team Falcons to Nigma Galaxy (leaving every other card).
      Formed after seeing the model's per-slot probabilities and after the group
      stage: out of sample with respect to the OUTCOMES, not independent of the
      model.
    # PARTLY RANDOMISED. The owner states that some picks were decided by a coin
    # flip. A coin-flipped slot carries no human judgement at all, so treating
    # this card as a pure judgemental forecast would measure a signal that is
    # not there. Which slots is not yet recorded; the field is left null rather
    # than guessed, exactly as the owner's probabilities were.
    randomisation: partial_coin_flip_owner_stated
    coin_flipped_slots: null
    model_implied_expected: 4.2039
    picks:
      UB QF1: Team Spirit
      UB QF2: Team Vision
      UB QF3: Team Liquid
      UB QF4: Nigma Galaxy
      UB SF1: Team Vision
      UB SF2: Team Liquid
      UB Final: Team Vision
      LB R1M1: BoomBoys
      LB R1M2: Team Falcons
      LB QF1: BoomBoys
      LB QF2: Team Falcons
      LB SF: Team Falcons
      LB Final: Team Falcons
      Grand Final: Team Vision

# Owner's subjective probabilities for the two disputed root decisions.
#
# NOT YET ELICITED. They are deliberately left null rather than guessed: a
# number invented here would be worthless, and one supplied after the matches
# would be worse than worthless. When supplied they must carry the provenance
# below, because the owner saw the model's numbers first and they are therefore
# not an independent forecast.
#
# These two probabilities describe TWO MATCHES, not the whole card. Card E is
# scored on the 14-slot hit count and needs none of them.
owner_probabilities:
  provenance: >-
    stated by the owner after viewing the model's probabilities and after
    watching the TI 2026 group stage; before any playoff outcome. Judgmental
    forecast, out of sample with respect to the outcomes but NOT independent of
    the model, whose numbers the owner had already seen.
  elicited: true
  liquid_beats_yandex: 0.60      # model says 0.4709, delta +0.1291
  iron_wing_beats_spirit: 0.55   # model says 0.4742, delta +0.0758
  # Taken as picks these are Team Liquid and Iron Wing -- BOTH root decisions.
  # That does NOT identify a single frozen card: D and E share both roots and
  # are separated only by six downstream slots, which these two numbers say
  # nothing about. So the field below is deliberately a pair, not `implied_card`.
  implied_root_decisions:
    UB QF1: Iron Wing
    UB QF3: Team Liquid
  consistent_with_cards: [D-override-both, E-owner, G-gemini-3-1-pro]
  card_actually_submitted: H-owner-final
  # The submitted card CONTRADICTS these probabilities and is deliberately not
  # in the consistent set above. 0.55 favours Iron Wing at UB QF1; H picks Team
  # Spirit. Either the stated number went stale within a day, or that slot was
  # one of the coin flips. Recorded rather than reconciled: quietly adjusting
  # the probability to match the pick would destroy the only evidence that a
  # stated forecast and a submitted action came apart.
  contradicted_by_submitted_card:
    slot: UB QF1
    stated_probability_favours: Iron Wing
    submitted_pick: Team Spirit

# An EXTERNAL REVIEWER's probabilities for the same two matches. Recorded in a
# separate block on purpose: they are not the owner's, and writing them into
# `owner_probabilities` above would manufacture an owner judgement that was
# never made. The owner's fields stay null until the owner states numbers.
#
# Two binary outcomes. This cannot establish calibration and is not scored as
# though it could -- its value is that a position was stated before the matches
# rather than remembered afterwards.
external_reviewer_probabilities:
  reviewer: external_gpt_reviewer_relayed_by_owner
  provenance: >-
    elicited after the model's probabilities were visible and after completion
    of the TI 2026 group stage; before any playoff outcome. Judgmental forecast,
    not independent of the supplied context or of the model output.
  elicited: true
  liquid_beats_yandex: 0.53      # model says 0.4709, delta +0.0591
  iron_wing_beats_spirit: 0.48   # model says 0.4742, delta +0.0058
  # Taken as picks these two probabilities are Liquid and Spirit -- ONE root
  # override, not both, so this is not the owner's position. It was unique to
  # card C until the external entrants were frozen; F shares the same two roots,
  # so a single `implied_card` label would now be false. Recorded as the pair
  # and the set, like the owner's block.
  implied_root_decisions:
    UB QF1: Team Spirit
    UB QF3: Team Liquid
  # Note: the owner's FINAL submitted card H shares these two roots. The
  # reviewer's stated position turned out to agree with what the owner
  # eventually submitted, and with neither the owner's own stated
  # probabilities nor the owner's earlier card E.
  consistent_with_cards: [C-override-liquid, F-gpt-5-6-xhigh, H-owner-final]
