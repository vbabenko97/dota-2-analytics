name: Offline CI

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.9.12"
          enable-cache: false
      - run: uv sync --locked --all-groups
      - name: Verify offline
        run: |
          runner_user="$(id -un)"
          sudo unshare --net -- sudo --user="$runner_user" -- \
            .venv/bin/python -m pytest -q
          sudo unshare --net -- sudo --user="$runner_user" -- \
            .venv/bin/python -m ruff check .
          git ls-files -z -- 'reports/runs/**/manifest.json' |
            xargs -0 -r -n1 dirname |
            xargs -r -n1 sudo unshare --net -- sudo --user="$runner_user" -- \
              .venv/bin/python -m ti26.cli_provenance verify-run \
              --at-source-revision --bundle
